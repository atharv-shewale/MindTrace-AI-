<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MINDTRACE Backend Test</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:20px}button{padding:8px 12px}</style>
</head>
<body>
  <h1>MINDTRACE — Backend Health Test</h1>
  <p>Click the button to call <code>/health</code> on the backend (http://localhost:8000/health).</p>
  <button id="check">Check /health</button>
  <pre id="output" style="white-space:pre-wrap;background:#f6f8fa;padding:12px;border-radius:6px;margin-top:12px;"></pre>

  <script>
    const output = document.getElementById('output');
    document.getElementById('check').addEventListener('click', async () => {
      output.textContent = 'Checking...';
      try {
        const res = await fetch('http://localhost:8000/health');
        const body = await res.text();
        let parsed;
        try { parsed = JSON.parse(body); } catch(e){ parsed = body }
        output.textContent = JSON.stringify({ status: res.status, body: parsed }, null, 2);
      } catch (err) {
        output.textContent = 'Network/Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
